<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spain 2027 · Setup</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇪🇸</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=586234">
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { boot, state, onState, esc, $, $$, seedStarter, store, isDemo, VERSION } from './js/common.js?v=586234';
    const root = document.getElementById('app');
    await boot(root, { surface: 'setup' });
    root.innerHTML = `<div class="plain-page">
      <p><a href="phone.html${location.search}">← Back to the planner</a></p>
      <h1>Setup</h1>
      <p class="muted">Only the trip owner can make these changes — the security rules enforce that.</p>
      <div class="ph-card"><h2>Guest list</h2>
        <p class="muted" style="margin-top:0">Only these addresses can sign in. Use the exact email each person signs in with (Google or Microsoft).</p>
        <ul class="list-plain" id="members"></ul>
        <form class="inline-form" id="m-form" style="flex-wrap:wrap">
          <input class="input" id="m-name" placeholder="Name (e.g. Zita)" required style="flex:1 1 120px">
          <input class="input" id="m-email" type="email" placeholder="email@example.com" required style="flex:2 1 200px">
          <button class="btn btn-primary">Add</button>
        </form>
      </div>
      <div class="ph-card"><h2>Starter content</h2>
        <p class="muted" style="margin-top:0">Loads the 4 route options and the starter idea cards. Safe to run again — it only adds what’s missing and never overwrites edits.</p>
        <button class="btn btn-primary" id="seed">Load starter content</button> <span id="seed-msg" class="muted"></span>
      </div>
      <div class="ph-card"><h2>Flights</h2>
        <p class="muted" style="margin-top:0">Choose the <b>flights.json</b> file Claude gave you. Flights can only be loaded once and are read-only afterwards.</p>
        <input type="file" id="flights-file" accept="application/json,.json"> <span id="f-msg" class="muted"></span>
      </div>
      <div class="ph-card"><h2>Start over</h2>
        <p class="muted" style="margin-top:0">Idea cards, comments, notes and the parking lot are kept either way.</p>
        <p><button class="btn" id="reset-route">Reset the route vote</button><br><span class="tiny muted">Clears everyone’s rankings, unlocks the route and sends the TV back to step 1.</span></p>
        <p><button class="btn btn-danger" id="reset-votes">Reset all idea votes</button><br><span class="tiny muted">Also clears every Must do / If time / Skip vote, the decisions on splits, and which day each idea is on.</span></p>
        <p><button class="btn btn-primary" id="reset-all">Fresh start (for Friday)</button><br><span class="tiny muted">Wipes all test activity: rankings, votes, decisions, day plans and notes, comments, parking lot and change history. Keeps the routes, the starter ideas, the guest list and the flights.</span><br>
          <label class="toggle" style="margin-top:6px"><input type="checkbox" id="rm-added"> Also delete ideas people added (keeps only the starter ideas)</label></p>
        <span id="reset-msg" class="muted"></span>
      </div>
      <p class="tiny muted">Signed in as ${esc(state.me.email)}${isDemo ? ' (demo)' : ''} · version ${VERSION}</p>
    </div>`;

    const renderMembers = () => {
      $('#members').innerHTML = state.members.map((m) => `<li><b>${esc(m.name)}</b><span class="grow muted">${esc(m.id)}</span><button class="btn btn-ghost" data-rm="${esc(m.id)}">Remove</button></li>`).join('') || '<li class="muted">Nobody yet — add yourself first.</li>';
      $$('[data-rm]').forEach((b) => (b.onclick = async () => { if (confirm('Remove ' + b.dataset.rm + '?')) await store.deleteDoc('members/' + b.dataset.rm).catch(fail); }));
    };
    onState(renderMembers); renderMembers();
    const fail = (e) => alert('That didn’t work: ' + (e.code === 'permission-denied' ? 'only the owner can do this.' : e.message));

    $('#m-form').onsubmit = async (e) => {
      e.preventDefault();
      const email = $('#m-email').value.trim().toLowerCase(), name = $('#m-name').value.trim();
      await store.setDoc('members/' + email, { name }).then(() => { $('#m-email').value = ''; $('#m-name').value = ''; }).catch(fail);
    };
    $('#seed').onclick = async () => {
      $('#seed-msg').textContent = 'Loading…';
      try { const n = await seedStarter(); $('#seed-msg').textContent = n ? `Added ${n} items.` : 'Everything was already there.'; }
      catch (e) { $('#seed-msg').textContent = ''; fail(e); }
    };
    const resetRoute = async () => {
      for (const r of state.rankings) await store.deleteDoc('rankings/' + r.id);
      await store.setDoc('session/state', { step: 'route', baseIndex: 0, cardIndex: 0, lockedRoute: null, revealRoutes: false, reveal: {}, updatedBy: state.me.name, updatedAt: Date.now() });
    };
    $('#reset-route').onclick = async () => {
      if (!confirm('Clear all route rankings and unlock the route?')) return;
      try { await resetRoute(); $('#reset-msg').textContent = '✓ Route vote reset'; } catch (e) { fail(e); }
    };
    $('#reset-votes').onclick = async () => {
      if (!confirm('Clear the route vote AND every idea vote, decision and day placement? This can’t be undone.')) return;
      try {
        await resetRoute();
        for (const c of state.cards) await store.updateDoc('cards/' + c.id, { votes: {}, decision: store.deleteField(), day: store.deleteField() });
        $('#reset-msg').textContent = '✓ Everything reset';
      } catch (e) { fail(e); }
    };
    $('#reset-all').onclick = async () => {
      const rmAdded = $('#rm-added').checked;
      if (!confirm('Wipe all test activity' + (rmAdded ? ' and delete added ideas' : '') + '? This can’t be undone.')) return;
      $('#reset-msg').textContent = 'Resetting…';
      try {
        await resetRoute();
        for (const c of state.cards) {
          if (rmAdded && c.createdBy !== 'Starter') { await store.deleteDoc('cards/' + c.id); continue; }
          for (const m of await store.getCol(`cards/${c.id}/comments`)) await store.deleteDoc(`cards/${c.id}/comments/${m.id}`);
          await store.updateDoc('cards/' + c.id, { votes: {}, decision: store.deleteField(), day: store.deleteField() });
        }
        for (const col of ['parking', 'days', 'history']) for (const d of await store.getCol(col)) await store.deleteDoc(`${col}/${d.id}`);
        $('#reset-msg').textContent = '✓ Fresh start — ready for Friday';
      } catch (e) { $('#reset-msg').textContent = ''; fail(e); }
    };
    $('#flights-file').onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data.sections)) throw new Error('This doesn’t look like the flights file.');
        await store.setDoc('meta/flights', data);
        $('#f-msg').textContent = '✓ Flights loaded';
      } catch (err) { fail(err); }
    };
  </script>
</body>
</html>
